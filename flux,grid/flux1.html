<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        nav{
            display: flex;
            background-color: orange;
            padding: 5px;
            justify-content: space-between;
            align-items: center;
            border-radius: 10px;
            box-shadow: 10px 20px 25px rgb(247, 255, 157);
        }
         
        ul{
            display: flex;
        }
        ul li{
            list-style-type: none;
            margin-left: 15px;
        }

        ul li a{
            text-decoration: none;
            color: black;
            
        }
    </style>
</head>
<body>
    <nav>
        <h1>Simple World</h1>
        <ul>
            <li><a href="">Home</a></li>
            <li><a href="">About</a></li>
            <li><a href="">Service</a></li>
            <li><a href="">Contact</a></li>
        </ul>
    </nav>
</body>
</html>
